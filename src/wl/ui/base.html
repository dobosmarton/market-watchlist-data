<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Watchlist</title>
<style>
  /* host style variables (MCP Apps) with fallbacks for hosts that send none */
  :root {
    color-scheme: light dark;
    font-family: var(--font-sans, system-ui, sans-serif);
    font-size: var(--font-text-sm-size, 14px);
    line-height: var(--font-text-sm-line-height, 1.4);
    color: var(--color-text-primary, CanvasText);
    background: transparent;
  }
  body { margin: 0; }
  main { padding: 12px; }
  header { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: var(--font-heading-sm-size, 14px); font-weight: var(--font-weight-semibold, 600); margin: 0; }
  .muted { color: var(--color-text-tertiary, GrayText); font-size: var(--font-text-xs-size, 12px); }
  .error { color: var(--color-text-danger, #b00020); }
  .spacer { flex: 1; }
  .chart { width: 100%; }
  .segmented { display: inline-flex; border: var(--border-width-regular, 1px) solid var(--color-border-secondary, #8884); border-radius: var(--border-radius-md, 8px); overflow: hidden; }
  button {
    font: inherit; color: inherit; background: transparent; border: 0; padding: 4px 10px;
    min-height: 28px; cursor: pointer;
  }
  .segmented button + button { border-left: var(--border-width-regular, 1px) solid var(--color-border-secondary, #8884); }
  button[aria-pressed="true"] { background: var(--color-background-inverse, CanvasText); color: var(--color-text-inverse, Canvas); }
  button.ghost { border: var(--border-width-regular, 1px) solid var(--color-border-secondary, #8884); border-radius: var(--border-radius-md, 8px); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 12px; }
  th, td { padding: 4px 6px; text-align: right; border-bottom: var(--border-width-regular, 1px) solid var(--color-border-tertiary, #8882); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { font-weight: var(--font-weight-medium, 500); color: var(--color-text-secondary, inherit); cursor: pointer; user-select: none; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<main id="root"><p class="muted">Loading…</p></main>
<script type="module">
  import {
    App, applyDocumentTheme, applyHostFonts, applyHostStyleVariables,
  } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.5/dist/src/app-with-deps.js";
  import vegaEmbed from "https://cdn.jsdelivr.net/npm/vega-embed@7.3.0/+esm";

  const root = document.getElementById("root");
  const app = new App(
    { name: "watchlist", version: "1.0.0" },
    { availableDisplayModes: ["inline", "fullscreen"] },
  );

  // ------------------------------------------------------------------ helpers for the views
  function h(tag, attrs = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else if (value !== null && value !== undefined) node.setAttribute(key, value);
    }
    node.append(...children.filter((child) => child !== null && child !== undefined));
    return node;
  }

  function token(name, fallback) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback;
  }

  // a Vega config drawn from the host's tokens, so charts follow light and dark mode
  function themeConfig() {
    const text = token("--color-text-secondary", "#555");
    const grid = token("--color-border-tertiary", "#8882");
    const font = token("--font-sans", "system-ui, sans-serif");
    return {
      background: null,
      font,
      view: { stroke: null },
      axis: { labelColor: text, titleColor: text, gridColor: grid, domainColor: grid, tickColor: grid, labelAngle: 0 },
      axisX: { grid: false },
      legend: { labelColor: text, titleColor: text },
      title: { color: token("--color-text-primary", "#111"), anchor: "start" },
      range: {
        category: [
          token("--color-text-info", "#3266ad"), token("--color-text-warning", "#a87829"),
          token("--color-text-success", "#437426"), token("--color-text-danger", "#a73d39"),
          token("--color-text-tertiary", "#73726c"),
        ],
      },
      mark: { color: token("--color-text-info", "#3266ad") },
    };
  }

  async function embed(target, spec) {
    const config = { ...themeConfig(), ...(spec.config ?? {}) };
    // ast: evaluate expressions with the interpreter instead of eval (sandbox CSP)
    const sized = { width: "container", autosize: { type: "fit-x", contains: "padding" }, ...spec, config };
    await vegaEmbed(target, sized, { ast: true, actions: false, renderer: "svg" });
  }

  function segmented(options, current, onPick) {
    return h("div", { class: "segmented", role: "group" }, ...options.map(([value, label]) =>
      h("button", { "aria-pressed": String(value === current), onclick: () => onPick(value) }, label)));
  }

  function fmt(value, digits = 1) {
    if (value === null || value === undefined || Number.isNaN(value)) return "–";
    return Number(value).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }

  function header(title, subtitle, ...controls) {
    const context = app.getHostContext();
    const canExpand = context?.availableDisplayModes?.includes("fullscreen") && context?.displayMode !== "fullscreen";
    return h("header", {},
      h("h1", {}, title), subtitle ? h("span", { class: "muted" }, subtitle) : null,
      h("span", { class: "spacer" }), ...controls,
      canExpand ? h("button", { class: "ghost", onclick: () => app.requestDisplayMode({ mode: "fullscreen" }) }, "Expand") : null);
  }

  // ------------------------------------------------------------------ the view
  /* VIEW */

  // ------------------------------------------------------------------ wiring
  let result = null;

  async function draw() {
    if (!result) return;
    if (result.isError || !result.structuredContent) {
      const text = result.content?.find((block) => block.type === "text")?.text ?? "No data.";
      root.replaceChildren(h("p", { class: result.isError ? "error" : "muted" }, text));
      return;
    }
    try {
      await render(result.structuredContent);
    } catch (error) {
      root.replaceChildren(h("p", { class: "error" }, `Could not draw this: ${error.message ?? error}`));
    }
  }

  function applyHost(context) {
    if (context.theme) applyDocumentTheme(context.theme);
    if (context.styles?.variables) applyHostStyleVariables(context.styles.variables);
    if (context.styles?.css?.fonts) applyHostFonts(context.styles.css.fonts);
    const inset = context.safeAreaInsets;
    if (inset) root.style.padding = `${12 + inset.top}px ${12 + inset.right}px ${12 + inset.bottom}px ${12 + inset.left}px`;
  }

  // handlers go in before connect() so the first tool result is not missed
  app.ontoolresult = (toolResult) => { result = toolResult; draw(); };
  app.onhostcontextchanged = (context) => { applyHost(context); draw(); };
  app.onteardown = async () => ({});
  await app.connect();
  const context = app.getHostContext();
  if (context) { applyHost(context); draw(); }
</script>
</body>
</html>
