# One-shot jobs. The MCP server runs locally over stdio (.mcp.json); Dagster is milestone 3.
services:
  refresh:
    build: .
    command: ["refresh", "all"]
    env_file: .env
    volumes:
      - ./watchlist.yaml:/app/watchlist.yaml:ro
      - ./financials:/app/financials:ro
      - ./data:/data
      - ./exports:/exports
  export:
    build: .
    command: ["export"]
    env_file: .env
    volumes:
      - ./data:/data
      - ./exports:/exports
