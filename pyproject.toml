[project]
name = "watchlist-data"
version = "0.1.0"
description = "Personal data pipeline for the market-analysis watchlist: prices, FX, filings, valuation ratios."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4",
    "httpx>=0.28",
    "polars>=1.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "structlog>=25.1",
    "tenacity>=9.0",
    "typer>=0.15",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.50"]

[project.scripts]
wl = "wl.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "hypothesis>=6.120",
    "inline-snapshot>=0.19",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "respx>=0.22",
    "ruff>=0.11",
    "ty>=0.0.30",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wl"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",      # missing docstrings: we document modules and non-obvious functions only
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
    "TD002",   # TODO author
    "TD003",   # TODO issue link
    "FIX002",  # allow TODOs
    "CPY001",  # no copyright headers in a personal project
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN201", "INP001"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "pydantic_settings.BaseSettings"]

# ---------------------------------------------------------------- types
[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportAny = false
reportExplicitAny = false

[tool.ty.environment]
python-version = "3.13"

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --cov=src/wl --cov-report=term-missing:skip-covered --cov-fail-under=85"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
omit = ["src/wl/cli.py"]
